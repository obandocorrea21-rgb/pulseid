<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseID - Ficha Médica y Simulador SOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #060a14;
            --superficie: #0d1526;
            --superficie-2: #121b31;
            --borde: #1d2a47;
            --texto: #e8ecf6;
            --texto-silenciado: #7e8bae;
            --acento: #3b6cf6;
            --acento-dim: #16224a;
            --critico: #f43f5e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: radial-gradient(ellipse 900px 500px at 15% -10%, #10203f 0%, transparent 60%), var(--bg);
            background-color: var(--bg);
            color: var(--texto);
            font-family: 'IBM Plex Sans', sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }

        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0 0 15px 0; }
        
        .contenedor {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 { color: var(--acento); }

        .tarjeta {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .dato-grupo { margin-bottom: 15px; }
        .dato-label { 
            color: var(--texto-silenciado); 
            font-size: 0.85em; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px; 
            display: block;
        }
        .dato-valor { 
            font-size: 1.1em; 
            font-weight: 500; 
            min-height: 24px;
        }

        /* Botones */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        .btn-editar {
            background-color: var(--acento);
            color: white;
        }

        .btn-sos {
            background-color: var(--critico);
            color: white;
            font-size: 1.3em;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
        }

        /* Estilo cuando el texto es editable */
        .editable-activo {
            border: 1px dashed var(--acento);
            padding: 5px;
            background-color: var(--superficie-2);
            border-radius: 4px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="header">
            <h1>PulseID</h1>
            <p>Ficha Médica de Emergencia</p>
        </div>

        <div class="tarjeta">
            <h2>Datos del Paciente</h2>
            
            <div class="dato-grupo">
                <span class="dato-label">Nombre Completo</span>
                <div id="nombrePaciente" class="dato-valor dato-editable">Cristian Obando</div>
            </div>
            
            <div class="dato-grupo">
                <span class="dato-label">Tipo de Sangre</span>
                <div id="tipoSangre" class="dato-valor dato-editable">O+</div>
            </div>

            <div class="dato-grupo">
                <span class="dato-label">Alergias</span>
                <div id="alergias" class="dato-valor dato-editable">Ninguna</div>
            </div>

            <div class="dato-grupo">
                <span class="dato-label">Condiciones Médicas</span>
                <div id="condicion" class="dato-valor dato-editable">Ninguna</div>
            </div>

            <button id="btnEditar" class="btn btn-editar" onclick="gestionarEdicion()">Editar Datos</button>
        </div>

        <button id="btnSos" class="btn btn-sos">🆘 ALERTA SOS (Mantener)</button>
    </div>

    <script>
        // --- LÓGICA DE CONTRASEÑA ---
        let modoEdicion = false;

        function gestionarEdicion() {
            let btn = document.getElementById("btnEditar");
            let elementosEditables = document.querySelectorAll('.dato-editable');

            if (!modoEdicion) {
                let contrasena = prompt("Por favor, ingrese la contraseña para modificar la ficha:");
                
                if (contrasena === "usuario1") {
                    modoEdicion = true;
                    
                    elementosEditables.forEach(el => {
                        el.setAttribute('contenteditable', 'true');
                        el.classList.add('editable-activo');
                    });
                    
                    btn.innerText = "💾 Guardar Cambios";
                    btn.style.backgroundColor = "#10b981"; // Cambia a verde
                } else if (contrasena !== null) {
                    alert("Contraseña incorrecta. Acceso denegado.");
                }
            } else {
                modoEdicion = false;
                
                elementosEditables.forEach(el => {
                    el.setAttribute('contenteditable', 'false');
                    el.classList.remove('editable-activo');
                });
                
                btn.innerText = "Editar Datos";
                btn.style.backgroundColor = "var(--acento)";
                alert("Cambios guardados en la vista actual exitosamente.");
            }
        }

        // --- LÓGICA DEL BOTÓN SOS ---
        let btnSos = document.getElementById('btnSos');
        let timer;
        
        // Mantiene presionado (PC)
        btnSos.addEventListener('mousedown', () => {
            timer = setTimeout(() => {
                alert("🚨 ALERTA ROJA ENVIADA: Mensaje de emergencia y ubicación compartida con contactos.");
            }, 1500); 
        });
        btnSos.addEventListener('mouseup', () => clearTimeout(timer));
        btnSos.addEventListener('mouseleave', () => clearTimeout(timer));

        // Mantiene presionado (Celular)
        btnSos.addEventListener('touchstart', (e) => {
            timer = setTimeout(() => {
                alert("🚨 ALERTA ROJA ENVIADA: Mensaje de emergencia y ubicación compartida con contactos.");
            }, 1500);
        });
        btnSos.addEventListener('touchend', () => clearTimeout(timer));
    </script>
</body>
</html>
